services:
  - type: web
    name: openspades-backend
    env: python
    buildCommand: pip install -r requirements.txt && python manage.py migrate --no-input && python manage.py collectstatic --no-input
    startCommand: daphne -b 0.0.0.0 -p $PORT config.asgi:application
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: "*"
      - key: DATABASE_URL
        fromDatabase:
          name: openspades-db
          property: connectionString
      - key: CORS_ALLOW_ALL_ORIGINS
        value: "False"
      - key: CORS_ALLOWED_ORIGINS
        value: "https://openspades.in,https://www.openspades.in"
      # Pinned because Django 4.2 doesn't support Python 3.14+ (confirmed
      # locally: /admin/ throws AttributeError on the template Context
      # internals under 3.14). Without this Render defaults to whatever its
      # platform picks, which will eventually be a version this app breaks
      # on. Bump this only alongside a Django upgrade that supports it.
      - key: PYTHON_VERSION
        value: "3.12.7"

databases:
  - name: openspades-db
    databaseName: openspades
    plan: free
